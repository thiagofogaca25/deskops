services:
  postgres:
    image: postgres:16-alpine
    container_name: deskops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deskops_db
      POSTGRES_USER: deskops
      POSTGRES_PASSWORD: deskops_password
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - deskops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskops -d deskops_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deskops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deskops_db
      SPRING_DATASOURCE_USERNAME: deskops
      SPRING_DATASOURCE_PASSWORD: deskops_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deskops-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://192.168.1.6:${BACKEND_PORT:-8081}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  deskops_pgdata:
